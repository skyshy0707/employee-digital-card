scalar JSON

type Query {
  profile(id: Int!): Profile
}

type Profile {
  id: ID!
  name: String!
  description: String
  links: [Link!]!
  skills: [String!]!
  experience: [Experience!]!
  projects: [Project!]!
}

type Link {
  id: ID!
  url: String!
  provider: String
  project: Project
}

type Experience {
  id: ID!
  company: String!
  position: String!
  period: JSON!
  achievements: [String!]!
}

type Project {
  id: ID!
  name: String!
  url: String!
  company: String
}